name: VALDR Site CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: PHP and static validation
        run: php scripts/validate.php
      - name: JavaScript syntax
        run: node --check assets/js/site.js
      - name: Start PHP server
        run: php -S 127.0.0.1:8080 -t . > /tmp/valdr-site.log 2>&1 &
      - name: Route, asset, language and header smoke
        run: php scripts/http-smoke.php http://127.0.0.1:8080
      - name: Guard against fake download artifacts
        run: |
          if grep -RIE --include='*.php' --include='*.html' 'href="[^"]+\.(exe|msi|dmg)(\?[^"]*)?"' .; then
            echo 'Executable link found before verified release data gate.' >&2
            exit 1
          fi
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/valdr-site.log || true

      - name: Guard private specification references
        run: |
          if grep -RIE --exclude-dir=.git --include='*.php' --include='*.html' --include='*.md' --include='*.json' 'VALDR_Master_TZ|Master[[:space:]]+TZ|Master[[:space:]]+Specification|source_master_spec|master_spec' .; then
            echo 'Private specification reference found in website repository.' >&2
            exit 1
          fi
