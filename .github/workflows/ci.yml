name: VALDR Site CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build Jekyll site
        run: bundle exec jekyll build --trace
      - name: Reject PHP in generated site
        run: |
          if find _site -type f -name '*.php' | grep -q .; then
            find _site -type f -name '*.php'
            exit 1
          fi
      - name: Guard fake executable downloads
        run: |
          if grep -RIE --include='*.html' 'href="[^"]+\.(exe|msi|dmg)(\?[^"]*)?"' _site; then exit 1; fi
      - name: Guard private specification references
        run: |
          if grep -RIE --exclude-dir=.git --exclude-dir=_site --include='*.md' --include='*.html' --include='*.yml' 'VALDR_Master_TZ|Master[[:space:]]+TZ|Master[[:space:]]+Specification|source_master_spec|master_spec' .; then exit 1; fi
      - name: Route smoke
        run: |
          python3 -m http.server 8080 --directory _site >/tmp/valdr-site.log 2>&1 &
          sleep 1
          for path in / /getting-started/ /how-it-works/ /wallet/ /node/ /mining/ /explorer/ /download/ /security/ /roadmap/ /faq/ /ru/ /ru/getting-started/ /ru/how-it-works/ /ru/wallet/ /ru/node/ /ru/mining/ /ru/explorer/ /ru/download/ /ru/security/ /ru/roadmap/ /ru/faq/; do
            curl --fail --silent --show-error "http://127.0.0.1:8080$path" >/dev/null
          done
